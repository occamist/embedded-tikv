name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Every run boots real TiKV clusters and may pull ~487 MB, so superseded runs on
# the same branch are not worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # One go.sum per module in the workspace. Without all three, the module
          # cache key ignores what examples and smoketest depend on.
          cache-dependency-path: |
            go.sum
            examples/go.sum
            smoketest/go.sum

      # pd-server and tikv-server are ~487 MB on linux, downloaded by the first
      # test that starts a cluster. The key is the file holding the version
      # constants; the restore-key is what matters day to day, since config.go
      # changes for unrelated reasons far more often than the version does and a
      # near-miss should still reuse the binaries rather than refetch them.
      - name: Cache TiKV binaries
        uses: actions/cache@v6
        with:
          path: ~/.embedded-tikv
          key: embedded-tikv-${{ runner.os }}-${{ hashFiles('config.go') }}
          restore-keys: |
            embedded-tikv-${{ runner.os }}-

      # A Go workspace does not fan a pattern out across its modules: ./... from
      # the root matches the root module alone, so examples and smoketest have to
      # be named. -p 1 keeps the three from booting their clusters at the same
      # time, which a two-core runner does not have the headroom for.
      - name: Test
        run: go test -race -v -timeout 20m -p 1 ./... ./examples/... ./smoketest/...
